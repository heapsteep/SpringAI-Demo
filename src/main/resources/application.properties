# For OpenAI:
#spring.application.name=SpringAI-Demo
#spring.ai.openai.api-key=${OPENAI_API_KEY}

# For Groq:
spring.application.name=SpringAI-Continued
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Groq has NO embeddings endpoint. Disable OpenAI embedding auto-config so the
# OpenAI starter does NOT try to create an EmbeddingModel pointed at Groq.
# We provide our own local TransformersEmbeddingModel bean (see AiConfig).
spring.ai.model.embedding=none

# Database configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_ai
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always

spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# --- pgvector store (RAG) ---
# Creates the `vector_store` table + the `vector` and `hnsw` extensions on startup.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Must match the embedding model dimension (all-MiniLM-L6-v2 = 384)
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public

# Increase request size for the optional /ai/rag/upload endpoint
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB