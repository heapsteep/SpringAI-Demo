plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.heapsteep'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0-M4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

	// --- RAG dependencies ---
	// PDF reader (uses PDFBox under the hood)
	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
	// Local ONNX transformer embedding model (free, no API key) - default: all-MiniLM-L6-v2 (384 dims)
	implementation 'org.springframework.ai:spring-ai-transformers'
	// PostgreSQL pgvector vector store (auto-config + schema init)
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'	
	// QuestionAnswerAdvisor (RAG advisor that injects retrieved context into the prompt)
	implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
